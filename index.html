<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRAX Online</title>
<style>
body { margin: 0; overflow: hidden; background: #05070a; }
canvas { display: block; }
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>

<script>

// SCENE
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 18;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// GRID
let nodes = [];
let activeIndex = 62;

const geo = new THREE.SphereGeometry(0.2, 10, 10);

for (let x=0; x<5; x++) {
  for (let y=0; y<5; y++) {
    for (let z=0; z<5; z++) {

      const mat = new THREE.MeshBasicMaterial({ color: 0x2a3a4a });
      const mesh = new THREE.Mesh(geo, mat);

      mesh.position.set(
        (x - 2) * 2,
        (y - 2) * 2,
        (z - 2) * 2
      );

      scene.add(mesh);
      nodes.push(mesh);
    }
  }
}

// MIRRA
const light = new THREE.PointLight(0xffcc88, 1.5, 40);
scene.add(light);

// GEMMA CORE
let trajectory = [];
let edges = {};
let nodeWeights = new Array(125).fill(0);

let lineGroup = new THREE.Group();
scene.add(lineGroup);

// UPDATE
function update() {

  Object.keys(edges).forEach(k => {
    edges[k] *= 0.98;
    if (edges[k] < 0.1) delete edges[k];
  });

  nodes.forEach((n,i) => {
    const w = nodeWeights[i];
    const brightness = Math.min(w * 0.1, 0.6);
    n.material.color.setRGB(0.16 + brightness, 0.23 + brightness, 0.3 + brightness);
  });

  const active = nodes[activeIndex];
  active.material.color.set(0x00ffd5);
  light.position.copy(active.position);

  trajectory.push(activeIndex);
  if (trajectory.length > 5) trajectory.shift();

  nodeWeights[activeIndex] += 1;

  for (let i = 0; i < trajectory.length - 1; i++) {
    const a = trajectory[i];
    const b = trajectory[i+1];
    const key = `${a}-${b}`;
    edges[key] = (edges[key] || 0) + 1;
  }

  lineGroup.clear();

  Object.keys(edges).forEach(key => {
    const [a, b] = key.split("-").map(Number);
    const weight = edges[key];

    const geometry = new THREE.BufferGeometry().setFromPoints([
      nodes[a].position,
      nodes[b].position
    ]);

    const intensity = Math.min(weight / 5, 1);

    const material = new THREE.LineBasicMaterial({
      color: new THREE.Color(0.4 + intensity, 0.4, 1),
      transparent: true,
      opacity: intensity
    });

    const line = new THREE.Line(geometry, material);
    lineGroup.add(line);
  });
}

// JUANA (BIAS)
function randomState() {

  if (Math.random() < 0.7) {
    let total = nodeWeights.reduce((a,b)=>a+b,0);

    if (total > 0) {
      let r = Math.random() * total;
      let sum = 0;

      for (let i=0;i<125;i++){
        sum += nodeWeights[i];
        if (sum >= r){
          activeIndex = i;
          update();
          return;
        }
      }
    }
  }

  activeIndex = Math.floor(Math.random() * 125);
  update();
}

// LOOP
function animate() {
  requestAnimationFrame(animate);
  scene.rotation.y += 0.002;
  scene.rotation.x += 0.001;
  renderer.render(scene, camera);
}

animate();
setInterval(randomState, 1200);

</script>

</body>
</html>
